
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Lifestyle News</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #294b3b, #83a77a);
            padding: 20px;
        }

        .container {
            width: 900px;
            min-height: 520px;
            display: flex;
            background: #f8faf7;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px #0004;
        }

        /* BAGIAN KIRI */
        .kiri {
            width: 50%;
            background:
                linear-gradient(
                    rgba(25, 55, 40, 0.78),
                    rgba(41, 75, 59, 0.88)
                ),
                url("https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=900&q=80")
                center/cover;

            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 35px;
        }

        .logo {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .kiri h1 {
            font-family: Georgia, serif;
            font-size: 31px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .kiri p {
            font-size: 13px;
            line-height: 1.9;
            color: #e8f0e4;
        }

        .garis {
            width: 65px;
            height: 4px;
            background: #c9dfb5;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .tagline {
            margin-top: 20px;
            color: #c9dfb5;
            font-size: 13px;
            font-style: italic;
        }

        /* BAGIAN KANAN */
        .kanan {
            width: 50%;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kanan h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #294b3b;
            font-size: 28px;
        }

        .deskripsi {
            text-align: center;
            font-size: 13px;
            color: #68766b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #34483a;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d7e2d3;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus {
            border-color: #63866b;
            box-shadow: 0 0 4px #63866b55;
        }

        .lupa {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 22px;
        }

        .lupa a {
            text-decoration: none;
            color: #52795c;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #52795c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #294b3b;
        }

        .daftar {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #68766b;
        }

        .daftar a {
            color: #52795c;
            text-decoration: none;
            font-weight: bold;
        }

        .kembali {
            text-align: center;
            margin-top: 18px;
        }

        .kembali a {
            color: #294b3b;
            text-decoration: none;
            font-size: 12px;
        }

        .lupa a:hover,
        .daftar a:hover,
        .kembali a:hover {
            text-decoration: underline;
        }

        /* TAMPILAN HP */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
                width: 100%;
            }

            .kiri,
            .kanan {
                width: 100%;
            }

            .kiri {
                min-height: 280px;
            }

            .kiri h1 {
                font-size: 25px;
            }

            .logo {
                font-size: 50px;
            }

            .kanan {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- BAGIAN KIRI -->
        <div class="kiri">

            <div class="logo">🌿</div>

            <div class="garis"></div>

            <h1>Lifestyle News</h1>

            <p>
                Portal Berita Gaya Hidup Modern<br>
                Inspirasi Fashion dan Kecantikan<br>
                Tips Kesehatan dan Self-Care
            </p>

            <div class="tagline">
                "Live Better, Feel Better"
            </div>

        </div>

        <!-- FORM LOGIN -->
        <div class="kanan">

            <h2>Sign In</h2>

            <p class="deskripsi">
                Masuk untuk menemukan inspirasi gaya hidup terbaru.
            </p>

            <form onsubmit="login(event)">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

                <div class="lupa">
                    <a href="#" onclick="lupaPassword(event)">
                        Lupa Password?
                    </a>
                </div>

                <button type="submit">
                    Sign In →
                </button>

            </form>

            <p class="daftar">
                Belum mempunyai akun?
                <a href="#" onclick="daftarAkun(event)">
                    Daftar di sini
                </a>
            </p>

            <div class="kembali">
                <a href="index.html">
                    ← Kembali ke Beranda
                </a>
            </div>

        </div>

    </div>

    <!-- JAVASCRIPT LOGIN -->
    <script>
        function login(event) {
            event.preventDefault();

            const username = document
                .getElementById("username")
                .value.trim();

            const password = document
                .getElementById("password")
                .value;

            if (
                username === "daraayu" &&
                password === "12345"
            ) {
                alert(
                    "Login berhasil! Selamat datang di Lifestyle News."
                );

                window.location.href = "index.html";
            } else {
                alert(
                    "Username atau password salah! Silakan coba lagi."
                );
            }
        }

        function lupaPassword(event) {
            event.preventDefault();

            alert(
                "Untuk bantuan password, silakan hubungi pengelola website."
            );
        }

        function daftarAkun(event) {
            event.preventDefault();

            alert(
                "Fitur pendaftaran akun belum tersedia pada versi demo."
            );
        }
    </script>

</body>
</html>
